apiVersion: v1
kind: Service
metadata:
  name: app
spec:
  ports:
    - port: 80
  selector:
    app.kubernetes.io/name: app
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: app
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: app
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - image: jmalloc/echo-server:v0.3.7
          name: app
          # TODO: 現状はコンテナ内で特権ポート `PORT: "80"`（< 1024）をバインドしているため `runAsNonRoot: true` や `capabilities.drop: [ALL]` を設定していない。
          # `PORT`（および Service の `targetPort`・NetworkPolicy）を非特権ポート（`8080` 等）に変更すれば非root化と全CapabilityのDropが可能。
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
          resources:
            requests:
              cpu: "10m"
              memory: "100Mi"
          env:
            - name: PORT
              value: "80"
      restartPolicy: Always
