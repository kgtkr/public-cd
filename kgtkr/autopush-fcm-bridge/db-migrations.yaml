apiVersion: batch/v1
kind: Job
metadata:
  name: db-migrations
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/sync-wave: "-1"
spec:
  template:
    metadata:
      labels:
        app.kubernetes.io/name: db-migrations
        network.kgtkr.net/egress-dns: "true"
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      tolerations:
        - key: "kubernetes.kgtkr.net/unreliable"
          effect: "NoSchedule"
      containers:
        - image: ghcr.io/kgtkr/autopush-fcm-bridge:20261030133320883-4941313-master
          name: db-migrations
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          args:
            - migrate
          env:
            - name: DATABASE_URL
              value: "postgresql://postgres:postgres@postgres:5432/postgres?sslmode=disable"
          envFrom:
            - secretRef:
                name: autopush-fcm-bridge-secret
          resources:
            requests:
              cpu: "20m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
      restartPolicy: Never
