apiVersion: batch/v1
kind: Job
metadata:
  name: db-migrate
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
spec:
  template:
    metadata:
      labels:
        app.kubernetes.io/name: db-migrate
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 991
        runAsGroup: 991
        seccompProfile:
          type: RuntimeDefault
      tolerations:
        - key: "kubernetes.kgtkr.net/unreliable"
          effect: "NoSchedule"
      containers:
        - image: ghcr.io/kgtkr/mastodon
          name: app
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: "100m"
              memory: "500Mi"
          args:
            - bundle
            - exec
            - rails
            - db:migrate
          envFrom:
            - secretRef:
                name: mastodon-config
            - secretRef:
                name: mastodon-secret
      restartPolicy: Never
