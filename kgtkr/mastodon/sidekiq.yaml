apiVersion: apps/v1
kind: Deployment
metadata:
  name: sidekiq
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: sidekiq
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sidekiq
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 991
        runAsGroup: 991
        seccompProfile:
          type: RuntimeDefault
      tolerations:
        - key: "kubernetes.kgtkr.net/unreliable"
          effect: "NoSchedule"
      containers:
        - image: ghcr.io/kgtkr/mastodon
          name: sidekiq
          # TODO: Sidekiq のメディア処理等で一時ファイル書き込み（`/opt/mastodon/tmp`、`/tmp`）が発生するため、
          # 現状は `readOnlyRootFilesystem: true` を設定していない。これらを `emptyDir` ボリュームとしてマウントすることで `readOnlyRootFilesystem: true` の有効化が可能になる。
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: "200m"
              memory: "500Mi"
            limits:
              cpu: "1000m"
              memory: "2000Mi"
          args:
            - bundle
            - exec
            - sidekiq
          envFrom:
            - secretRef:
                name: mastodon-config
            - secretRef:
                name: mastodon-secret
      restartPolicy: Always
