apiVersion: batch/v1
kind: CronJob
metadata:
  name: remove-orphans
spec:
  schedule: "0  0  */5  *  *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app.kubernetes.io/name: remove-orphans
        spec:
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 991
            runAsGroup: 991
            seccompProfile:
              type: RuntimeDefault
          tolerations:
            - key: "kubernetes.kgtkr.net/unreliable"
              effect: "NoSchedule"
          containers:
            - image: ghcr.io/kgtkr/mastodon
              name: app
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
              env:
                - name: S3_READ_TIMEOUT
                  value: "300"
              resources:
                requests:
                  cpu: "10m"
                  memory: "300Mi"
              args:
                - tootctl
                - media
                - remove-orphans
              envFrom:
                - secretRef:
                    name: mastodon-config
                - secretRef:
                    name: mastodon-secret
          restartPolicy: Never
