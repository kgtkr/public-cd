apiVersion: v1
kind: Service
metadata:
  name: web
spec:
  ports:
    - port: 3000
  selector:
    app.kubernetes.io/name: web
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: web
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: web
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 991
        runAsGroup: 991
        seccompProfile:
          type: RuntimeDefault
      containers:
        - image: ghcr.io/kgtkr/mastodon
          name: web
          # TODO: 起動時の `rm -f /mastodon/tmp/pids/server.pid` や Rails の一時ファイル・キャッシュ書き込み（`/opt/mastodon/tmp`、`/tmp`）が発生するため、
          # 現状は `readOnlyRootFilesystem: true` を設定していない。これらを `emptyDir` ボリュームとしてマウントすることで `readOnlyRootFilesystem: true` の有効化が可能になる。
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: "100m"
              memory: "500Mi"
          args:
            - bash
            - -c
            - "rm -f /mastodon/tmp/pids/server.pid; bundle exec rails s -p 3000"
          #livenessProbe:
          #  exec:
          #    command:
          #      - bash
          #      - -c
          #      - wget -q --spider --proxy=off localhost:3000/health || exit 1
          envFrom:
            - secretRef:
                name: mastodon-config
            - secretRef:
                name: mastodon-secret
      restartPolicy: Always
