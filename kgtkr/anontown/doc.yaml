apiVersion: v1
kind: Service
metadata:
  name: doc
spec:
  ports:
    - port: 4928
  selector:
    app.kubernetes.io/name: doc
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: doc
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: doc
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: doc
    spec:
      automountServiceAccountToken: false
      # TODO: anontown-docのDockerfileはUSER未指定(root)かつ `CMD npm start` で起動時に `/home/app/.npm` へ書き込むため、
      # runAsNonRoot: trueやreadOnlyRootFilesystem: trueを有効化するとnpm起動時に権限エラーになる。
      # 静的配信バイナリ直接実行またはNixイメージ化を行えば、runAsNonRoot: true / readOnlyRootFilesystem: true まで絞ることが可能。
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - image: ghcr.io/kgtkr/anontown-doc:20240210180820143-e390199
          name: doc
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: "10m"
              memory: "5Mi"
      restartPolicy: Always
