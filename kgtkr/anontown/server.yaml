apiVersion: v1
kind: Service
metadata:
  name: server
spec:
  ports:
    - port: 8080
  selector:
    app.kubernetes.io/name: server
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: server
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: server
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: server
    spec:
      automountServiceAccountToken: false
      # TODO: anontown-serverのDockerfileはUSER未指定(root)かつWORKDIR /home(root所有)で `npx lerna run start` を実行するため、
      # 現状のままrunAsNonRoot: trueやreadOnlyRootFilesystem: trueを有効化するとnpx/npmのキャッシュ作成等で権限エラーになる。
      # Nixで非rootイメージとしてビルドするか、Dockerfileでnode直接起動+非rootユーザー指定に変更すれば、
      # runAsNonRoot: true / readOnlyRootFilesystem: true まで絞ることが可能。
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - image: ghcr.io/kgtkr/anontown-server:20260612120724975-bdeac8a
          name: server
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: "10m"
              memory: "100Mi"
          envFrom:
            - secretRef:
                name: secret
            - configMapRef:
                name: anontown-config
          env:
            - name: SERVER_PORT
              value: "8080"
            - name: TZ
              value: "Asia/Tokyo"
            - name: REDIS_HOST
              value: redis:6379
            - name: DATABASE_URL
              value: "postgresql://postgres:postgres@postgres:5432/postgres?schema=public"
            - name: FAKTORY_URL
              value: "tcp://faktory:7419"

      restartPolicy: Always
