apiVersion: v1
kind: Service
metadata:
  name: client
spec:
  ports:
    - port: 3000
  selector:
    app.kubernetes.io/name: client
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: client
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: client
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: client
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - image: ghcr.io/kgtkr/anontown-client:20260612120719229-17dc877
          name: client
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: "10m"
              memory: "100Mi"
          envFrom:
            - configMapRef:
                name: anontown-config
          env:
            - name: PORT
              value: "3000"
      restartPolicy: Always
