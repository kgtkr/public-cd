apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: discord-pin-bot
  name: discord-pin-bot
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: discord-pin-bot
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: discord-pin-bot
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - image: ghcr.io/kgtkr/discord-pin-bot:20260620100054911-e0e9d8a
          name: discord-pin-bot
          # TODO: `lifecycle.postStart` で root 所有の `/home/app` 直下にシンボリックリンク（`/home/app/config.json`）を作成しているため、
          # 現状は `runAsNonRoot: true` や `readOnlyRootFilesystem: true` を設定できない。
          # 環境変数（または別ディレクトリのマウント）で設定を受け取るように変更し、Nix 等で非rootイメージをビルドすれば、`runAsNonRoot: true` および `readOnlyRootFilesystem: true` の有効化が可能になる。
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: "10m"
              memory: "15Mi"
          volumeMounts:
            - mountPath: /var/discord-pin-bot/config
              name: discord-pin-bot-config
              readOnly: true
          lifecycle:
            postStart:
              exec:
                command:
                  - ln
                  - -s
                  - /var/discord-pin-bot/config/config.json
                  - /home/app/config.json
      restartPolicy: Always
      volumes:
        - name: discord-pin-bot-config
          secret:
            secretName: discord-pin-bot-config
