apiVersion: v1
kind: Service
metadata:
  name: minio
spec:
  ports:
    - port: 9000
      name: s3
    - port: 9001
      name: console
  selector:
    app.kubernetes.io/name: minio
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: minio
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: minio
  serviceName: minio
  template:
    metadata:
      labels:
        app.kubernetes.io/name: minio
    spec:
      automountServiceAccountToken: false
      # TODO: 既存PVC（`/data`）内のファイルが root 所有で作成されているため、現状は `runAsNonRoot: true` を設定していない。
      # `fsGroup` やマイグレーションで権限を変更すれば非root化が可能。
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      nodeSelector:
        kubernetes.io/hostname: saba
      tolerations:
        - key: kubernetes.kgtkr.net/unreliable
          effect: NoSchedule
      containers:
        - image: quay.io/minio/minio:RELEASE.2021-12-29T06-49-06Z
          name: minio
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: "10m"
              memory: "30Mi"
          volumeMounts:
            - mountPath: /data
              name: minio-data
          envFrom:
            - secretRef:
                name: minio-config
          command:
            - /bin/sh
            - -c
            - |
              mkdir -p /data/longhorn;
              mkdir -p /data/.minio.sys/buckets/longhorn;
              minio server /data --console-address :9001;
      restartPolicy: Always
      volumes:
        - name: minio-data
          persistentVolumeClaim:
            claimName: minio-data
