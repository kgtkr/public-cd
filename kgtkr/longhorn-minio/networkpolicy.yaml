apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: minio
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: minio
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: longhorn-system
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: rclone
      ports:
        - protocol: TCP
          port: 9000
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx-private
      ports:
        - protocol: TCP
          port: 9001
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: rclone
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: rclone
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: minio
      ports:
        - protocol: TCP
          port: 9000
    # TODO: rclone.yamlのinitContainersがGoogle DriveのOAuthトークン更新をKubernetes Secret(rclone-current-config)に
    # 保存するためにkubectlを実行しており、Kubernetes APIサーバー(10.43.0.1:443 -> DNAT後コントロールプレーンノードの6443)への
    # Egressを許可せざるを得ない状態になっている。
    # トークン保存先をSecretではなくPVC等に変更してkubectlへの依存をなくせば、以下の443/6443許可とServiceAccount権限は削除可能。
    - to:
        - ipBlock:
            cidr: 10.43.0.1/32
      ports:
        - protocol: TCP
          port: 443
    - ports:
        - protocol: TCP
          port: 6443
