apiVersion: batch/v1
kind: CronJob
metadata:
  name: rclone
spec:
  schedule: "0 6 * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app.kubernetes.io/name: rclone
        spec:
          # TODO: initContainers（`get-secret` / `patch-secret`）で `kubectl` を実行し、Google Drive の更新された OAuth トークンを
          # Kubernetes Secret（`rclone-current-config`）へ書き戻す設計のため、`automountServiceAccountToken: false` は設定できない。
          # また、`bitnamilegacy/kubectl`（UID 1001）と `rclone/rclone`（デフォルト root）で同一の `emptyDir`（`/config/rclone`）上の設定ファイルを読み書きするため、
          # 現状は Pod 全体の `runAsNonRoot: true` を設定していない。トークン管理方式の変更や実行ユーザーの統一により、さらなる権限縮小が可能。
          serviceAccountName: rclone
          securityContext:
            seccompProfile:
              type: RuntimeDefault
          tolerations:
            - key: "kubernetes.kgtkr.net/unreliable"
              effect: "NoSchedule"
          initContainers:
            - image: bitnamilegacy/kubectl:1.33
              name: get-secret
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
              command:
                - /bin/sh
                - -euc
                - |
                  kubectl get secret rclone-init-config -o jsonpath='{.data.config}' | base64 -d > /config/rclone/rclone-init.conf
                  if [ -z "$(kubectl get secret rclone-current-config -o jsonpath='{.data.config}')" ]; then
                    kubectl create secret generic rclone-current-config --from-file=config=/config/rclone/rclone-init.conf
                  fi
                  kubectl get secret rclone-current-config -o jsonpath='{.data.config}' | base64 -d > /config/rclone/rclone.conf
              volumeMounts:
                - mountPath: /config/rclone
                  name: rclone-config
            - image: rclone/rclone:1.75
              name: app
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
              resources:
                requests:
                  cpu: "10m"
                  memory: "300Mi"
              command:
                - /bin/sh
                - -euc
                - |
                  # volume.cfgが一定以上かをチェックすることで誤ってバックアップが全削除されることを防ぐ
                  COUNT=$(rclone ls --max-depth 7 --include volume.cfg minio: | wc -l)
                  test $COUNT -ge 3

                  rclone -v sync minio:/longhorn gdrive:/longhorn --fast-list
              volumeMounts:
                - mountPath: /config/rclone
                  name: rclone-config
            - image: bitnamilegacy/kubectl:1.33
              name: patch-secret
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
              command:
                - /bin/sh
                - -euc
                - |
                  kubectl create secret generic rclone-current-config --from-file=config=/config/rclone/rclone.conf -o yaml --dry-run=client | kubectl apply -f -
              volumeMounts:
                - mountPath: /config/rclone
                  name: rclone-config
          containers:
            - image: alpine:3.24
              name: nop
              securityContext:
                readOnlyRootFilesystem: true
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
              command:
                - echo
          volumes:
            - name: rclone-config
              emptyDir: {}
          restartPolicy: Never
