apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: discord-category-join-manager-use-message-command
  name: discord-category-join-manager-use-message-command
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: discord-category-join-manager-use-message-command
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: discord-category-join-manager-use-message-command
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - image: ghcr.io/kgtkr/discord-category-join-manager:20220221133340180-94b9e4d-use_message_command
          name: discord-category-join-manager-use-message-command
          # TODO: `lifecycle.postStart` で root 所有の `/home/app` 直下にシンボリックリンク（`/home/app/config.json`）を作成しているため、
          # 現状は `runAsNonRoot: true` や `readOnlyRootFilesystem: true` を設定できない。
          # 環境変数（または別ディレクトリのマウント）で設定を受け取るように変更し、Nix 等で非rootイメージをビルドすれば、`runAsNonRoot: true` および `readOnlyRootFilesystem: true` の有効化が可能になる。
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: "10m"
              memory: "15Mi"
          volumeMounts:
            - mountPath: /var/discord-category-join-manager-use-message-command/config
              name: discord-category-join-manager-use-message-command-config
              readOnly: true
          lifecycle:
            postStart:
              exec:
                command:
                  - ln
                  - -s
                  - /var/discord-category-join-manager-use-message-command/config/config.json
                  - /home/app/config.json
      restartPolicy: Always
      volumes:
        - name: discord-category-join-manager-use-message-command-config
          secret:
            secretName: discord-category-join-manager-use-message-command-config
