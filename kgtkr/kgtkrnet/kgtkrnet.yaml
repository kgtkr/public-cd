apiVersion: v1
kind: Service
metadata:
  name: kgtkrnet
spec:
  ports:
    - port: 3000
  selector:
    app.kubernetes.io/name: kgtkrnet
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kgtkrnet
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kgtkrnet
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kgtkrnet
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - image: ghcr.io/kgtkr/kgtkr.net:20261113090633853-5a0453c
          name: kgtkrnet
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: "10m"
              memory: "200Mi"
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
      restartPolicy: Always
