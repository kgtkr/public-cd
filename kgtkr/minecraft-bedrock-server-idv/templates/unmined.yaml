apiVersion: batch/v1
kind: CronJob
metadata:
  name: unmined
spec:
  schedule: "0 8 * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app.kubernetes.io/name: unmined
          annotations:
            kubectl.kubernetes.io/default-container: unmined
        spec:
          automountServiceAccountToken: false
          # TODO: `rclone/rclone` および `ghcr.io/kgtkr/unmined-docker` の Dockerfile に `USER` 指定がなく root 実行前提となっているため、
          # 現状は `runAsNonRoot: true` を設定していない。非rootユーザーでのビルドに対応すれば `runAsNonRoot: true` の有効化が可能になる。
          securityContext:
            seccompProfile:
              type: RuntimeDefault
          tolerations:
            - key: "kubernetes.kgtkr.net/unreliable"
              effect: "NoSchedule"
          nodeSelector:
            kubernetes.io/arch: amd64
          initContainers:
            - image: rclone/rclone:1.75
              name: download
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
              resources:
                requests:
                  cpu: "10m"
                  memory: "300Mi"
              command:
                - /bin/sh
                - -euc
                - |
                  rclone sync minio:/worlds /data/worlds --fast-list
                  rclone sync minio:/unmined /data/unmined --fast-list
              volumeMounts:
                - mountPath: /config/rclone
                  name: minio-secret
                  readOnly: true
                - mountPath: /data/worlds
                  name: worlds
                - mountPath: /data/unmined
                  name: unmined
            - name: unmined
              image: ghcr.io/kgtkr/unmined-docker:20250215043116987-9c03f91
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
              command:
                - "sh"
                - "-ec"
                - |
                  out () {
                    dimension=$1
                    ./unmined-cli web render --world=/data/worlds/level --output=/data/unmined/$dimension --dimension=$dimension --zoomin=-3 --imageformat=webp $2
                    mv /data/unmined/$dimension/unmined.index.html /data/unmined/$dimension/index.html
                  }
                  out overworld
                  out nether "--topY=80"
                  out end
              resources:
                requests:
                  cpu: "1500m"
                  memory: "500Mi"
              volumeMounts:
                - mountPath: /data/worlds
                  name: worlds
                  readOnly: true
                - mountPath: /data/unmined
                  name: unmined
            - name: upload
              image: rclone/rclone:1.75
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
              command:
                - /bin/sh
                - -euc
                - |
                  rclone sync /data/unmined minio:/unmined --fast-list
              volumeMounts:
                - mountPath: /data/unmined
                  name: unmined
                  readOnly: true
                - mountPath: /config/rclone
                  name: minio-secret
                  readOnly: true
          containers:
            - image: alpine:3.24
              name: nop
              securityContext:
                readOnlyRootFilesystem: true
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
              command:
                - echo
          volumes:
            - name: worlds
              emptyDir: {}
            - name: unmined
              emptyDir: {}
            - name: minio-secret
              secret:
                secretName: minio-secret
          restartPolicy: Never
