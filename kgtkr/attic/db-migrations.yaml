apiVersion: batch/v1
kind: Job
metadata:
  name: db-migrations
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/sync-wave: "-1"
spec:
  template:
    metadata:
      labels:
        app.kubernetes.io/name: db-migrations
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      tolerations:
        - key: "kubernetes.kgtkr.net/unreliable"
          effect: "NoSchedule"
      containers:
        - image: ghcr.io/zhaofengli/attic
          name: attic
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          args:
            - -f
            - /opt/attic/config.toml
            - --mode
            - db-migrations
          resources:
            requests:
              cpu: "100m"
              memory: "300Mi"
          envFrom:
            - secretRef:
                name: attic-secret
            - configMapRef:
                name: attic-env
          volumeMounts:
            - name: config-volume
              mountPath: /opt/attic/
              readOnly: true
      volumes:
        - name: config-volume
          configMap:
            name: attic-config
      restartPolicy: Never
