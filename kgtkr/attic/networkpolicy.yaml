apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: api-server
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: api-server
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8080
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: postgres
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: minio
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 9000
    # TODO: config.tomlで署名付きURL発行用と内部S3通信用のendpointが共通(https://attic-minio.kgtkr.net)になっているため、
    # クラスタ内からもIngress(ingress-nginx / 163.44.96.193)経由でMinIOへアクセスする必要がありEgressを許可している。
    # Attic側で内部通信用エンドポイントと署名用エンドポイントを分離するか、PodのhostAliases等でattic-minio.kgtkr.netを
    # 同一Namespace内のminio Serviceへ直接向ければ、ingress-nginxおよびPublic IPへのEgressは削除可能。
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 8443
    - to:
        - ipBlock:
            cidr: 163.44.96.193/32
      ports:
        - protocol: TCP
          port: 443
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: garbage-collector
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: garbage-collector
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: postgres
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: minio
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 9000
    # TODO: api-server同様、config.tomlのS3 endpointがhttps://attic-minio.kgtkr.netとなっているため
    # ingress-nginx / 163.44.96.193へのEgressを許可している。直接minio Serviceのみと通信するよう改善できれば削除可能。
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 8443
    - to:
        - ipBlock:
            cidr: 163.44.96.193/32
      ports:
        - protocol: TCP
          port: 443
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: db-migrations
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: db-migrations
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: postgres
      ports:
        - protocol: TCP
          port: 5432
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: postgres
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: api-server
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: garbage-collector
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: db-migrations
      ports:
        - protocol: TCP
          port: 5432
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: minio
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: minio
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: api-server
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: garbage-collector
      ports:
        - protocol: TCP
          port: 9000
        - protocol: TCP
          port: 443
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx-private
      ports:
        - protocol: TCP
          port: 9001
