apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
  - networkpolicy.yaml
replacements:
  - source:
      kind: NetworkPolicy
      name: allow-egress-internet-https
      fieldPath: spec.egress.0.to.0.ipBlock
    targets:
      - select:
          kind: NetworkPolicy
          name: allow-egress-internet-http
        fieldPaths:
          - spec.egress.0.to.0.ipBlock
      - select:
          kind: NetworkPolicy
          name: allow-egress-internet-smtp
        fieldPaths:
          - spec.egress.0.to.0.ipBlock
