apiVersion: v1
kind: Service
metadata:
  name: app
spec:
  ports:
    - port: 3000
      name: http
  selector:
    app.kubernetes.io/name: app
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: app
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - image: ghcr.io/kgtkr/ghcr-webhook-router:20261017163220920-786e273-master
          name: app
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: PORT
              value: "3000"
            - name: TARGET_REPOS
              value: "kgtkr/public-cd"
            - name: DISPATCH_EVENT_TYPE
              value: "ghcr_package_published"
            - name: TAG_INCLUDE_REGEX
              value: "^\\d{17}-[0-9a-f]{7}(-.*)?$"
            - name: TAG_EXCLUDE_REGEX
              value: "-(amd64|arm64)$"
            - name: DEBOUNCE_MS
              value: "5000"
          envFrom:
            - secretRef:
                name: ghcr-webhook-router-secret
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: "10m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
      restartPolicy: Always
